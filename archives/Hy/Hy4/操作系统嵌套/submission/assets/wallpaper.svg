<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a6b"/>
      <stop offset="28%" stop-color="#3f6fa8"/>
      <stop offset="55%" stop-color="#7aa6cf"/>
      <stop offset="76%" stop-color="#d9b6a0"/>
      <stop offset="100%" stop-color="#f6d3a8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c9" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb6cf"/>
      <stop offset="40%" stop-color="#5a8fb0"/>
      <stop offset="100%" stop-color="#2c5578"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f86a8"/><stop offset="100%" stop-color="#3c5170"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#54688c"/><stop offset="100%" stop-color="#2a3b58"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4e6b"/><stop offset="100%" stop-color="#1d2c44"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3a2c"/><stop offset="100%" stop-color="#0e2018"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1330" cy="430" r="300" fill="url(#sunGlow)"/>
  <circle cx="1330" cy="430" r="66" fill="#fff1c4" opacity="0.92"/>
  <circle cx="1330" cy="430" r="90" fill="#ffdd97" opacity="0.25" filter="url(#glow)"/>
  <!-- 云 -->
  <g fill="#ffffff" opacity="0.16" filter="url(#soft)">
    <ellipse cx="420" cy="210" rx="230" ry="26"/><ellipse cx="520" cy="240" rx="180" ry="20"/>
    <ellipse cx="980" cy="150" rx="200" ry="22"/><ellipse cx="1600" cy="270" rx="240" ry="24"/>
  </g>
  <g fill="#f7d7b0" opacity="0.22">
    <ellipse cx="1180" cy="330" rx="260" ry="14"/><ellipse cx="1470" cy="360" rx="190" ry="11"/>
  </g>
  <!-- 远山 -->
  <path d="M0 620 L180 470 L320 560 L520 400 L700 540 L880 440 L1080 560 L1280 420 L1500 540 L1720 440 L1920 560 L1920 720 L0 720 Z" fill="url(#m1)" opacity="0.75"/>
  <path d="M0 660 L220 520 L400 620 L600 490 L820 620 L1020 500 L1240 630 L1460 500 L1680 620 L1920 510 L1920 760 L0 760 Z" fill="url(#m2)"/>
  <!-- 雪线 -->
  <path d="M520 400 L560 435 L500 430 L470 462 L440 430 Z" fill="#e9f1ff" opacity="0.8"/>
  <path d="M1280 420 L1320 458 L1250 450 L1215 480 L1185 448 Z" fill="#e9f1ff" opacity="0.75"/>
  <path d="M1720 440 L1755 472 L1695 466 L1660 492 L1635 464 Z" fill="#e9f1ff" opacity="0.7"/>
  <!-- 中景山 -->
  <path d="M0 720 L260 600 L460 700 L680 580 L900 700 L1120 590 L1380 700 L1600 590 L1920 700 L1920 820 L0 820 Z" fill="url(#m3)"/>
  <!-- 湖面 -->
  <rect x="0" y="720" width="1920" height="360" fill="url(#lake)"/>
  <g opacity="0.22" fill="#fff3cf">
    <rect x="1260" y="740" width="150" height="4" rx="2"/><rect x="1230" y="762" width="210" height="3" rx="2"/>
    <rect x="1280" y="786" width="120" height="3" rx="2"/><rect x="1210" y="812" width="250" height="3" rx="2"/>
    <rect x="1270" y="842" width="140" height="3" rx="2"/><rect x="1190" y="874" width="290" height="3" rx="2"/>
    <rect x="1250" y="910" width="180" height="3" rx="2"/>
  </g>
  <g opacity="0.12" stroke="#cfe3f5" stroke-width="2" fill="none">
    <path d="M0 780 Q400 770 800 784 T1920 776"/><path d="M0 850 Q500 838 1000 852 T1920 842"/>
    <path d="M0 940 Q600 928 1200 942 T1920 932"/><path d="M0 1010 Q400 1000 900 1012 T1920 1004"/>
  </g>
  <!-- 湖中倒影 -->
  <path d="M0 720 L150 790 L300 725 L480 800 L660 730 L860 805 L1060 735 L1260 800 L1460 730 L1660 800 L1920 730 L1920 720 Z" fill="#243c58" opacity="0.35"/>
  <!-- 前景树林 -->
  <path d="M0 900 L120 850 L260 910 L420 840 L580 910 L760 850 L940 910 L1120 845 L1300 905 L1500 845 L1700 905 L1920 850 L1920 1080 L0 1080 Z" fill="url(#fg)"/>
  <g fill="#0b1a12">
    <path d="M70 1080 L110 880 L150 1080 Z"/><path d="M200 1080 L250 900 L300 1080 Z"/>
    <path d="M360 1080 L400 860 L440 1080 Z"/><path d="M520 1080 L570 895 L620 1080 Z"/>
    <path d="M700 1080 L740 870 L780 1080 Z"/><path d="M880 1080 L930 890 L980 1080 Z"/>
    <path d="M1060 1080 L1100 865 L1140 1080 Z"/><path d="M1240 1080 L1290 890 L1340 1080 Z"/>
    <path d="M1420 1080 L1460 860 L1500 1080 Z"/><path d="M1600 1080 L1650 890 L1700 1080 Z"/>
    <path d="M1780 1080 L1820 870 L1860 1080 Z"/>
  </g>
  <!-- 飞鸟 -->
  <g stroke="#20304a" stroke-width="3" fill="none" opacity="0.6">
    <path d="M760 330 q12 -12 24 0 q12 -12 24 0"/><path d="M830 300 q9 -9 18 0 q9 -9 18 0"/>
  </g>
  <rect width="1920" height="1080" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="2"/>
</svg>
