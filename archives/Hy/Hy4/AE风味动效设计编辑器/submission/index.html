<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISMA · 动效设计编辑器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ================= TOP BAR ================= -->
  <header id="topbar">
    <div class="brand"><span class="brand-mark">◈</span><span class="brand-name">PRISMA</span><span class="brand-sub">动效设计编辑器</span></div>
    <nav class="menubar" id="menubar"></nav>
    <div class="top-right">
      <span class="autosave" id="autosaveLabel">● 已自动保存</span>
      <span class="sep"></span>
      <div class="ws-switch" id="wsSwitch"></div>
      <button class="icon-btn" id="helpBtn" title="快捷键与帮助 (?)">?</button>
    </div>
  </header>

  <!-- ================= TOOL ROW ================= -->
  <div id="toolrow">
    <div class="tools" id="tools"></div>
    <div class="tool-divider"></div>
    <label class="chk"><input type="checkbox" id="snapChk" checked><span>吸附</span></label>
    <div class="snap-to" id="snapTo" title="吸附目标">关键帧 · 播放头 · 标记 · 入出点</div>
    <div class="tool-divider"></div>
    <label class="chk"><input type="checkbox" id="guideChk" checked><span>辅助线</span></label>
    <label class="chk"><input type="checkbox" id="mbChk" checked><span>运动模糊</span></label>
    <div class="tool-spacer"></div>
    <div class="tool-info" id="toolInfo">选择工具 · 拖动移动 / 缩放 / 旋转</div>
  </div>

  <!-- ================= MAIN ================= -->
  <div id="main">

    <!-- LEFT -->
    <aside id="left" class="panel-col">
      <section class="panel" id="projectPanel">
        <div class="panel-head"><span class="ph-title">项目</span><span class="ph-actions" id="projActions"></span></div>
        <div class="panel-body" id="projectBody"></div>
      </section>
      <section class="panel" id="infoPanel">
        <div class="panel-head"><span class="ph-title">信息 / 资源</span></div>
        <div class="panel-body" id="infoBody"></div>
      </section>
    </aside>

    <div class="splitter" data-split="left"></div>

    <!-- CENTER -->
    <section id="center">
      <div id="viewer">
        <div id="viewtoolbar">
          <div class="comp-tabs" id="compTabs"></div>
          <div class="vt-right">
            <select id="viewSelect" class="mini-sel" title="辅助视图">
              <option value="persp">透视 / 活动相机</option>
              <option value="front">前视图</option>
              <option value="top">顶视图</option>
              <option value="left">左视图</option>
              <option value="custom">自定义视图</option>
            </select>
            <select id="zoomSelect" class="mini-sel" title="画布缩放">
              <option value="fit">适配</option>
              <option value="0.25">25%</option>
              <option value="0.5">50%</option>
              <option value="0.75">75%</option>
              <option value="1">100%</option>
              <option value="1.5">150%</option>
            </select>
            <span class="vsep"></span>
            <button class="tb active" id="toggleGrid" title="网格 / 安全框">▦</button>
            <button class="tb active" id="toggleOverlay" title="选择框与控制手柄">◻</button>
            <button class="tb active" id="toggleMotion" title="运动路径">⤳</button>
            <span class="vsep"></span>
            <span class="res-badge" id="resBadge">完整</span>
          </div>
        </div>
        <div id="canvasWrap">
          <canvas id="gl"></canvas>
          <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="canvasBadge">合成画布</div>
          <div id="pasteHint">画布缩放与平移 · 滚轮缩放 · 空格拖动平移</div>
        </div>
        <div id="transport">
          <div class="tr-left">
            <span class="time-code" id="timeCode">00:00:00:00</span>
            <span class="tc-sub" id="tcSub">0.000 s</span>
          </div>
          <div class="tr-center" id="transportBtns"></div>
          <div class="tr-right">
            <label class="chk mini"><input type="checkbox" id="loopChk" checked><span>循环工作区</span></label>
            <label class="chk mini"><input type="checkbox" id="audioChk" checked><span>声音</span></label>
            <span class="vsep"></span>
            <span class="fps-badge" id="fpsBadge">30 fps</span>
          </div>
        </div>
      </div>
    </section>

    <div class="splitter" data-split="right"></div>

    <!-- RIGHT -->
    <aside id="right" class="panel-col">
      <div class="rt-tabs" id="rightTabs"></div>
      <div class="rt-body" id="rightBody"></div>
    </aside>
  </div>

  <div class="splitter horizontal" data-split="bottom"></div>

  <!-- ================= BOTTOM WORKSPACE ================= -->
  <div id="bottom">
    <div id="bottomHead">
      <div class="bw-tabs" id="bottomTabs"></div>
      <div class="bw-actions" id="bottomActions"></div>
    </div>
    <div id="bottomBody"></div>
  </div>

  <!-- ================= STATUS ================= -->
  <footer id="status">
    <span class="st-item" id="stActive">活动合成：—</span>
    <span class="st-sep"></span>
    <span class="st-item" id="stSel">未选择</span>
    <span class="st-sep"></span>
    <span class="st-item" id="stCam">相机：默认</span>
    <span class="st-sep"></span>
    <span class="st-item" id="stTime">t = 0.000s</span>
    <span class="st-grow"></span>
    <span class="st-item" id="stMode">标准工作区</span>
    <span class="st-sep"></span>
    <span class="st-item" id="stHint">空格播放 · F9 缓动 · ? 帮助</span>
  </footer>
</div>

<div id="modalRoot"></div>
<div id="contextMenu"></div>
<div id="toastRoot"></div>
<input type="file" id="fileInput" style="display:none">

<!-- classic scripts, file:// safe (no ES modules) -->
<script src="js/core.js"></script>
<script src="js/geometry.js"></script>
<script src="js/renderer.js"></script>
<script src="js/engine.js"></script>
<script src="js/demo.js"></script>
<script src="js/export.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui_canvas.js"></script>
<script src="js/ui_timeline.js"></script>
<script src="js/ui_props.js"></script>
<script src="js/ui_curve.js"></script>
<script src="js/ui_nodes.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
