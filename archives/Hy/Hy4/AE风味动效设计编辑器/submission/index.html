<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锻字 · AE 风味动效设计编辑器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">锻</span>
      <span class="brand-text"><b>FORGE</b><i>动效设计编辑器</i></span>
    </div>
    <nav id="mainmenu" class="menu"></nav>
    <div class="top-mid">
      <span id="projectName">锻字 · 示例工程</span>
      <span class="dot-sep">·</span>
      <span id="compName">主合成</span>
    </div>
    <div class="top-right">
      <span class="badge" id="rendererBadge">WebGL 2</span>
      <button class="tbtn" id="btnSave" title="保存工程 (Ctrl+S)">保存</button>
      <button class="tbtn" id="btnOpen" title="打开工程 (Ctrl+O)">打开</button>
      <button class="tbtn accent" id="btnPlayTop" title="播放/暂停 (空格)">▶ 播放</button>
    </div>
  </header>

  <div id="toolbar">
    <div class="tool-group" id="toolButtons"></div>
    <div class="tool-sep"></div>
    <div class="tool-group" id="viewerTabs"></div>
    <div class="tool-spacer"></div>
    <div class="tool-group small">
      <label class="mini-lbl">视图</label>
      <select id="zoomSelect" class="mini-select">
        <option value="fit">适合</option>
        <option value="0.25">25%</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
      <button class="tbtn" id="btnGrid" title="显示网格/辅助">⊞ 辅助</button>
      <button class="tbtn" id="btnOverlay" title="叠加辅助元素">◈ 叠加</button>
    </div>
  </div>

  <div id="workspace">

    <aside id="left" class="col">
      <section class="panel" id="panelProject">
        <div class="panel-head"><span>项目</span><div class="ph-actions"><button data-act="newComp" title="新建合成">＋</button><button data-act="newFolder" title="新建文件夹">▢</button></div></div>
        <div class="panel-body" id="projectTree"></div>
      </section>
      <section class="panel" id="panelAssets">
        <div class="panel-head"><span>素材 / 字形库</span></div>
        <div class="panel-body" id="assetList"></div>
      </section>
      <section class="panel grow" id="panelAudio">
        <div class="panel-head"><span>声音 / 电平</span></div>
        <div class="panel-body" id="audioPanel"></div>
      </section>
    </aside>

    <section id="center" class="col">
      <div id="viewerWrap">
        <div class="view" id="viewComp">
          <div class="canvas-stage" id="canvasStage">
            <canvas id="glCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
            <div class="comp-label" id="compLabel"></div>
            <div class="safe-guides" id="safeGuides"></div>
          </div>
        </div>
        <div class="view" id="viewGraph" hidden>
          <div class="graph-head">
            <span class="ph-title">曲线编辑器 · 动画/速度</span>
            <div class="seg" id="graphMode"><button data-m="value" class="on">值曲线</button><button data-m="speed">速度曲线</button></div>
            <div class="seg" id="graphProps"></div>
            <span class="hint" id="graphHint">拖动关键帧与手柄编辑 · 滚轮缩放</span>
          </div>
          <canvas id="graphCanvas"></canvas>
        </div>
        <div class="view" id="viewNodes" hidden>
          <div class="graph-head">
            <span class="ph-title">程序节点 · 几何流</span>
            <button class="tbtn" id="nodeAdd">＋ 节点</button>
            <button class="tbtn" id="nodeEval">重新计算</button>
            <span class="hint">拖动连线 · 端口区分标量/向量/颜色/几何/场</span>
          </div>
          <canvas id="nodeCanvas"></canvas>
          <div class="node-inspector" id="nodeInspector"></div>
        </div>
        <div class="view" id="viewRender" hidden>
          <div id="renderSettings"></div>
        </div>
      </div>

      <div id="viewerFooter">
        <div class="transport" id="transport"></div>
        <div class="vf-right">
          <span class="tc" id="timeCode">00:00:00:00</span>
          <span class="fps" id="fpsLbl">30 fps</span>
        </div>
      </div>
    </section>

    <aside id="right" class="col">
      <section class="panel grow" id="panelProps">
        <div class="panel-head"><span id="propTitle">属性 / 效果控件</span><div class="ph-actions"><button data-act="collapseAll" title="折叠全部">⇤</button></div></div>
        <div class="panel-body" id="propBody"></div>
      </section>
      <section class="panel" id="panelAlign">
        <div class="panel-head"><span>对齐 / 分布 / 视图</span></div>
        <div class="panel-body" id="alignBody"></div>
      </section>
    </aside>
  </div>

  <div id="timeline">
    <div id="tlHead">
      <div class="tl-title">时间轴 <span id="tlCompName"></span></div>
      <div class="tl-controls" id="tlControls"></div>
      <div class="tl-legend" id="tlLegend"></div>
    </div>
    <div id="tlMain">
      <div id="tlLeft">
        <div id="tlColHeads"><span>图层名称</span><span>入/出</span><span>模式</span></div>
        <div id="tlLayerList"></div>
      </div>
      <div id="tlRight">
        <div id="tlRulerWrap"><canvas id="tlRuler"></canvas></div>
        <div id="tlTracksWrap">
          <canvas id="tlTracks"></canvas>
          <div id="tlPlayhead"></div>
          <div id="tlWorkArea"></div>
          <div id="tlMarquee"></div>
        </div>
      </div>
    </div>
  </div>

  <footer id="statusbar">
    <span id="statusText">就绪 · 打开时已自动载入 15 秒示例《锻字》</span>
    <span id="statusExpr"></span>
    <span id="statusRight">空格 播放 · F9 缓动 · Ctrl+Z 撤销 · Ctrl+Shift+C 预合成</span>
  </footer>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<!-- classic scripts: file:// friendly, load order matters -->
<script src="js/util.js"></script>
<script src="js/expr.js"></script>
<script src="js/model.js"></script>
<script src="js/geom.js"></script>
<script src="js/glyphs.js"></script>
<script src="js/nodes.js"></script>
<script src="js/particles.js"></script>
<script src="js/shaders.js"></script>
<script src="js/renderer.js"></script>
<script src="js/scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/demo.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/export.js"></script>
<script src="js/main.js"></script>
</body>
</html>
