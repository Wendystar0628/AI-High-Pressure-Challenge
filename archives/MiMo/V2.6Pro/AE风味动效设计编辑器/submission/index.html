<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AE 风味动效设计编辑器</title>
<link rel="stylesheet" href="dist/bundle.css" />
<style>
  /* 文件直开时的兜底加载提示 */
  #boot-loading {
    position: fixed; inset: 0;
    background: #0a0c10; color: #8a93a6;
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", sans-serif; font-size: 13px;
    z-index: 9999; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="boot-loading">正在载入动效编辑器…</div>
<div id="app"></div>
<script src="dist/bundle.js"></script>
<script>
  // 隐藏加载提示
  (function wait() {
    if (window.__app && window.__app.project) {
      var el = document.getElementById('boot-loading');
      if (el) el.remove();
    } else {
      setTimeout(wait, 80);
    }
  })();
</script>
</body>
</html>
