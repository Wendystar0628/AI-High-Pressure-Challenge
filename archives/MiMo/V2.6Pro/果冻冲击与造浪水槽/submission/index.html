<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>果冻冲击与造浪水槽</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="brand-title">果冻冲击与造浪水槽</div>
      <div class="brand-sub">软体 · 刚体 · 流体 交互模拟</div>
    </div>
    <nav id="scene-tabs">
      <button class="tab active" data-scene="1">场景一 · 果冻冲击</button>
      <button class="tab" data-scene="2">场景二 · 造浪水槽</button>
    </nav>
    <div class="top-actions">
      <button id="btn-sound" class="icon-btn" title="声音开关">声音：开</button>
      <button id="btn-fullscreen" class="icon-btn" title="全屏">全屏</button>
    </div>
  </header>

  <main id="stage-wrap">
    <canvas id="gl"></canvas>

    <!-- 场景一控制面板 -->
    <aside id="panel-1" class="panel left">
      <section class="card">
        <h3>冲击模式</h3>
        <div class="btn-row" id="mode-row">
          <button class="mode-btn active" data-mode="center">单球正中</button>
          <button class="mode-btn" data-mode="offset">偏心撞击</button>
          <button class="mode-btn" data-mode="multi">多球连续</button>
        </div>
      </section>

      <section class="card">
        <h3>运行控制</h3>
        <div class="btn-row">
          <button id="j-trigger" class="primary">开始冲击</button>
          <button id="j-pause">暂停</button>
          <button id="j-reset">重置</button>
        </div>
        <label class="slider-row">
          <span>慢动作 <b id="slow-val">1.0×</b></span>
          <input type="range" id="slow-slider" min="0.1" max="1" step="0.05" value="1">
        </label>
      </section>

      <section class="card">
        <h3>重球参数</h3>
        <label class="slider-row"><span>质量 <b id="v-ball-mass">5.0</b></span>
          <input type="range" id="ball-mass" min="1" max="30" step="0.5" value="5"></label>
        <label class="slider-row"><span>半径 <b id="v-ball-radius">0.55</b></span>
          <input type="range" id="ball-radius" min="0.3" max="1.0" step="0.05" value="0.55"></label>
        <label class="slider-row"><span>初始高度 <b id="v-ball-height">6.0</b></span>
          <input type="range" id="ball-height" min="2.5" max="12" step="0.5" value="6"></label>
        <div id="multi-extra" class="hidden">
          <label class="slider-row"><span>球数 <b id="v-ball-count">3</b></span>
            <input type="range" id="ball-count" min="2" max="6" step="1" value="3"></label>
          <label class="slider-row"><span>释放间隔 <b id="v-ball-interval">0.70</b>s</span>
            <input type="range" id="ball-interval" min="0.3" max="1.5" step="0.05" value="0.7"></label>
        </div>
      </section>

      <section class="card">
        <h3>果冻参数</h3>
        <label class="slider-row"><span>软硬程度 <b id="v-jelly-stiff">1.00</b></span>
          <input type="range" id="jelly-stiff" min="0.3" max="2.5" step="0.05" value="1"></label>
        <label class="slider-row"><span>阻尼 <b id="v-jelly-damp">0.18</b></span>
          <input type="range" id="jelly-damp" min="0.02" max="0.6" step="0.01" value="0.18"></label>
        <label class="slider-row"><span>密度 <b id="v-jelly-density">1.00</b></span>
          <input type="range" id="jelly-density" min="0.4" max="2.0" step="0.05" value="1"></label>
        <label class="slider-row"><span>宽度 <b id="v-jelly-size">3.00</b></span>
          <input type="range" id="jelly-size" min="1.8" max="4.2" step="0.1" value="3"></label>
        <div class="select-row">
          <span>底部固定</span>
          <select id="jelly-fix">
            <option value="none">不固定</option>
            <option value="corner" selected>四角固定</option>
            <option value="bottom">底面固定</option>
          </select>
        </div>
      </section>

      <section class="card">
        <h3>碰撞与环境</h3>
        <label class="slider-row"><span>重力 <b id="v-gravity">9.8</b></span>
          <input type="range" id="gravity" min="2" max="20" step="0.2" value="9.8"></label>
        <label class="slider-row"><span>平台摩擦 <b id="v-friction">0.35</b></span>
          <input type="range" id="friction" min="0" max="1" step="0.05" value="0.35"></label>
        <label class="slider-row"><span>平台弹性 <b id="v-bounce">0.25</b></span>
          <input type="range" id="bounce" min="0" max="0.9" step="0.05" value="0.25"></label>
      </section>
    </aside>

    <!-- 场景二控制面板 -->
    <aside id="panel-2" class="panel left hidden">
      <section class="card">
        <h3>实验控制</h3>
        <div class="btn-row">
          <button id="t-release" class="primary">释放小球</button>
          <button id="t-wave">启动造浪</button>
          <button id="t-stopwave">停止造浪</button>
        </div>
        <div class="btn-row">
          <button id="t-pause">暂停</button>
          <button id="t-reset">重置</button>
        </div>
        <label class="slider-row">
          <span>慢动作 <b id="slow-val2">1.0×</b></span>
          <input type="range" id="slow-slider2" min="0.1" max="1" step="0.05" value="1">
        </label>
        <div class="hint">默认流程：全部入水后 1 秒自动启动造浪，持续 5 秒后自动停止。</div>
      </section>

      <section class="card">
        <h3>流体参数</h3>
        <label class="slider-row"><span>水位 <b id="v-water-level">2.10</b></span>
          <input type="range" id="water-level" min="1.2" max="3.0" step="0.05" value="2.1"></label>
        <label class="slider-row"><span>重力 <b id="v-t-gravity">9.8</b></span>
          <input type="range" id="t-gravity" min="2" max="20" step="0.2" value="9.8"></label>
        <label class="slider-row"><span>粘性 <b id="v-viscosity">0.35</b></span>
          <input type="range" id="viscosity" min="0.05" max="1.2" step="0.05" value="0.35"></label>
      </section>

      <section class="card">
        <h3>小球参数</h3>
        <label class="slider-row"><span>统一半径 <b id="v-t-ball-r">0.34</b></span>
          <input type="range" id="t-ball-r" min="0.22" max="0.55" step="0.02" value="0.34"></label>
        <label class="slider-row"><span>每组数量 <b id="v-t-per-group">2</b></span>
          <input type="range" id="t-per-group" min="1" max="4" step="1" value="2"></label>
        <label class="slider-row"><span>释放高度 <b id="v-t-drop-h">3.2</b></span>
          <input type="range" id="t-drop-h" min="1.5" max="6" step="0.1" value="3.2"></label>
      </section>

      <section class="card">
        <h3>水槽尺寸</h3>
        <label class="slider-row"><span>长度 <b id="v-tank-l">9.0</b></span>
          <input type="range" id="tank-l" min="6" max="13" step="0.5" value="9"></label>
        <label class="slider-row"><span>宽度（纵深）<b id="v-tank-w">3.6</b></span>
          <input type="range" id="tank-w" min="2.4" max="5" step="0.2" value="3.6"></label>
        <label class="slider-row"><span>高度 <b id="v-tank-h">3.4</b></span>
          <input type="range" id="tank-h" min="2.4" max="4.5" step="0.2" value="3.4"></label>
      </section>

      <section class="card">
        <h3>造浪装置</h3>
        <div class="select-row">
          <span>装置类型</span>
          <select id="wave-type">
            <option value="paddle" selected>侧向推板</option>
            <option value="plunger">往复波板</option>
            <option value="piston">活塞板</option>
          </select>
        </div>
        <label class="slider-row"><span>启动延迟 <b id="v-wave-delay">1.0</b>s</span>
          <input type="range" id="wave-delay" min="0" max="4" step="0.1" value="1"></label>
        <label class="slider-row"><span>运动幅度 <b id="v-wave-amp">0.45</b></span>
          <input type="range" id="wave-amp" min="0.1" max="1.0" step="0.05" value="0.45"></label>
        <label class="slider-row"><span>运动频率 <b id="v-wave-freq">1.10</b>Hz</span>
          <input type="range" id="wave-freq" min="0.3" max="2.5" step="0.05" value="1.1"></label>
        <label class="slider-row"><span>持续时长 <b id="v-wave-dur">5.0</b>s</span>
          <input type="range" id="wave-dur" min="1" max="12" step="0.5" value="5"></label>
      </section>
    </aside>

    <!-- 状态提示 -->
    <div id="status-bar">
      <span id="status-text">就绪 — 点击「开始冲击」触发模拟</span>
    </div>
  </main>
</div>
<script src="js/bundle.js"></script>
</body>
</html>
