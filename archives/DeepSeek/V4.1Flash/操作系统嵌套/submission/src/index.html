<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested OS</title>
  <link rel="stylesheet" href="/src/css/base.css">
  <link rel="stylesheet" href="/src/css/apps.css">
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="boot-splash">
    <div class="boot-logo">
      <svg viewBox="0 0 100 100" width="76" height="76" aria-hidden="true">
        <defs>
          <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a99bff"/><stop offset=".5" stop-color="#6f5bff"/><stop offset="1" stop-color="#3be0cf"/>
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="58" height="58" rx="16" fill="none" stroke="url(#bl)" stroke-width="5"/>
        <rect x="28" y="28" width="58" height="58" rx="16" fill="none" stroke="url(#bl)" stroke-width="5" opacity=".75"/>
        <circle cx="50" cy="50" r="8" fill="url(#bl)"/>
      </svg>
    </div>
    <div class="boot-title">Nested OS</div>
    <div class="boot-sub">正在唤醒嵌套桌面…</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <div id="root-os" aria-label="Nested OS 根系统桌面"></div>
  <div id="toast-layer" aria-live="polite"></div>
  <div id="modal-layer"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
