<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>流形 · 动效设计编辑器</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 17c4-10 8 4 12-6s4-4 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="3" cy="17" r="2" fill="currentColor"/></svg><span>流形</span><em>MOTION</em></div>
    <nav id="menubar"></nav>
    <div id="toolbar"></div>
    <div class="spacer"></div>
    <div id="workspaces"></div>
  </header>
  <main id="main">
    <section id="leftcol" class="panel">
      <div class="phead"><span>项目</span><div class="pbtns" id="projBtns"></div></div>
      <div id="project" class="pbody"></div>
    </section>
    <div class="vsplit" data-split="left"></div>
    <section id="centercol">
      <div id="viewerWrap" class="panel">
        <div class="phead" id="viewerHead"></div>
        <div id="viewer">
          <canvas id="glc"></canvas>
          <canvas id="ovc"></canvas>
          <div id="viewerInfo"></div>
          <div id="viewerHint"></div>
        </div>
        <div id="viewerFoot"></div>
      </div>
      <div class="hsplit" data-split="bottom"></div>
      <div id="bottomWrap" class="panel">
        <div class="phead" id="bottomHead"></div>
        <div id="bottom">
          <div id="timelinePane" class="bpane"><canvas id="tlc"></canvas></div>
          <div id="graphPane" class="bpane"><canvas id="grc"></canvas><div id="graphSide"></div></div>
          <div id="nodesPane" class="bpane"><canvas id="ndc"></canvas><div id="nodeSide"></div></div>
        </div>
      </div>
    </section>
    <div class="vsplit" data-split="right"></div>
    <section id="rightcol" class="panel">
      <div class="phead"><span id="propTitle">属性</span><div class="pbtns" id="propBtns"></div></div>
      <div id="props" class="pbody"></div>
    </section>
  </main>
  <footer id="statusbar"><span id="status">就绪</span><span class="spacer"></span><span id="stats"></span></footer>
</div>
<div id="overlayLayer"></div>
<input type="file" id="fileOpen" accept=".json,.motion" style="display:none">
<input type="file" id="audioOpen" accept="audio/*" style="display:none">
<script src="js/core/util.js"></script>
<script src="js/geom/path.js"></script>
<script src="js/geom/poly.js"></script>
<script src="js/core/model.js"></script>
<script src="js/core/anim.js"></script>
<script src="js/core/expr.js"></script>
<script src="js/core/eval.js"></script>
<script src="js/geom/font.js"></script>
<script src="js/geom/content.js"></script>
<script src="js/geom/mesh.js"></script>
<script src="js/geom/puppet.js"></script>
<script src="js/sim/nodes.js"></script>
<script src="js/sim/particles.js"></script>
<script src="js/render/gl.js"></script>
<script src="js/render/render2d.js"></script>
<script src="js/render/render3d.js"></script>
<script src="js/io/audio.js"></script>
<script src="js/io/export.js"></script>
<script src="js/ui/widgets.js"></script>
<script src="js/ui/app.js"></script>
<script src="js/ui/viewer.js"></script>
<script src="js/ui/timeline.js"></script>
<script src="js/ui/graph.js"></script>
<script src="js/ui/nodeui.js"></script>
<script src="js/ui/props.js"></script>
<script src="js/ui/project.js"></script>
<script src="js/demo/demo.js"></script>
<script src="js/main.js"></script>
</body>
</html>
