<!doctype html>
<!-- 页面模板：home（展示页）。路由插件按它生成该类型的每个路由，中文在根路径、英文在 /en/。
     可用记号见 site/README.md「页面模板」；
     head / top / bottom 三个 @ 标记由插件换成站点头部、命令栏和页脚，别删。
     <main> 里的内容全部由 src/pages/home/ 按数据画出（home.md）。 -->
<html lang="{{htmlLang}}" data-st-paper="neutral" data-st-cut="standard" data-st-ground="stars" data-st-density="standard" data-st-motion="full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <!--@head-->
  </head>
  <body class="st site" data-page="home" data-lang="{{lang}}" data-id="{{id}}">
    <!--@top-->
    <main id="main" class="page-home" tabindex="-1" data-slot="page"></main>
    <!--@bottom-->
    <script type="module" src="/src/pages/home/main.js"></script>
  </body>
</html>
