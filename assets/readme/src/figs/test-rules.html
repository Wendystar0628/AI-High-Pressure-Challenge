<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="size" content="960x910">
<title>工具与联网规定</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .desc { margin-top: 10px; }

  .grid { display: grid; grid-template-columns: 214px repeat(7, 1fr); margin-top: 18px; }
  .grid > div { border-top: 1px solid var(--rule); padding: 10px 4px; }
  .grid .bare { border-top: none; }

  /* Kind of task over its columns: mark, name, a bracket opening downward. */
  .grid > .kind { grid-row: 1; border-top: none; padding: 0 6px 8px; display: flex; flex-direction: column; align-items: center; }
  .kind h3 { font-size: 15px; line-height: 22px; display: flex; align-items: center; }
  .kind .k.std { margin-right: 8px; }
  .kind .k.des { margin-right: 6px; }
  .kind i.br { align-self: stretch; height: 7px; margin-top: 6px; border: 1px solid var(--ink); border-bottom: none; }

  /* Column head: category colour bar (lime steps take the ink edge), icons, task group, what it is. */
  .ch { border-top: none !important; text-align: center; padding-top: 0 !important; }
  .ch .bar { display: flex; column-gap: 2px; height: 6px; margin: 0 4px 10px; }
  .ch .bar em { flex: 1; }
  .ch .ic { display: flex; justify-content: center; column-gap: 3px; height: 18px; margin-bottom: 4px; }
  .ch .ic .icon { width: 17px; height: 17px; }
  .ch b { display: block; font-size: 14px; line-height: 20px; }
  .ch span { display: block; font-family: var(--font-text); font-size: 12px; line-height: 17px; color: var(--ink-2); margin-top: 2px; }

  /* Section heads. */
  .sec { grid-column: 1 / -1; border-top: 1px solid var(--ink) !important; padding: 12px 0 2px !important;
         display: flex; align-items: baseline; column-gap: 12px; }
  .sec h3 { font-size: 15px; }
  .rh { display: flex; flex-direction: column; justify-content: center; padding-left: 0 !important; padding-right: 14px !important; }
  .rh b { font-size: 14px; font-weight: 700; line-height: 20px; }
  .rh span { font-family: var(--font-text); font-size: 12px; line-height: 17px; color: var(--ink-2); margin-top: 1px; }

  /* Marks, neutral so lime and violet keep meaning the two kinds of task. */
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; row-gap: 5px; }
  .cell p { font-family: var(--font-text); font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .cell.txt { justify-content: center; }
  .cell.txt p { font-size: 13px; line-height: 18px; color: var(--ink); }
  .yes { width: 16px; height: 16px; flex: none; overflow: visible; }
  .no { width: 28px; height: 12px; flex: none; margin-top: 2px; background: var(--hatch); outline: 1px solid var(--ink); outline-offset: -1px; }
  .na { width: 12px; height: 1.5px; flex: none; margin-top: 7px; background: var(--ink-3); }
  /* A rule for every task: one hatched band across the seven columns. */
  .all { grid-column: 2 / -1; display: flex; align-items: center; padding: 0 8px !important; }
  .all i { flex: 1; height: 12px; background: var(--hatch); outline: 1px solid var(--ink); outline-offset: -1px; }

  .key { display: flex; align-items: center; column-gap: 22px; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--ink);
         font-size: 13px; color: var(--ink-2); }
  .key span { display: inline-flex; align-items: center; column-gap: 8px; white-space: nowrap; }
  .key .no { margin-top: 0; width: 22px; }
  .key .na { margin-top: 0; }
  .foot { margin-top: 8px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs><symbol id="yes" viewBox="0 0 16 16"><path d="M2.5 8.5 L6.5 12.5 L13.5 3.5" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="square"/></symbol></defs>
</svg>
<div class="frame">
  <header class="head">
    <div class="pair"><span class="eyebrow slash">What Each Task May Use</span><h2 class="title">各类题能用什么</h2></div>
    <i class="lead"></i>
  </header>
  <p class="desc">以各题面的“规定”一节为准。</p>
  <div class="grid" id="grid"></div>
  <div class="key">
    <span><svg class="yes"><use href="#yes"/></svg>可以</span>
    <span><i class="no"></i>规定禁止</span>
    <span><i class="na"></i>题面没有写</span>
  </div>
  <p class="desc foot">所有受测会话都接入同一个浏览器 MCP（无窗口的本机 Chrome，使用显卡），只有网页题的题面提到它。</p>
</div>
<script>
// Facts: each statement's 规定 section, README.md (工具与联网规定) and the previous figure.
// Columns: task groups; cats give the colour bar and icons.
const COLS = [
  { name: '形式化证明题', sub: 'Lean 4', cats: ['reason'] },
  { name: '数学竞赛<br>原创试题', sub: '纸面证明', cats: ['reason'] },
  { name: '极值构造', sub: '1 题', cats: ['algo'] },
  { name: '性能工程', sub: '2 题', cats: ['algo'] },
  { name: '鲁班锁拆解', sub: '手工推演', cats: ['spatial'] },
  { name: '网页题', sub: '5 题', cats: ['interact', 'game', 'physics', 'visual'] },
  { name: '操作系统嵌套', sub: '桌面项目', cats: ['system'] },
];
const STD = new Set(['reason', 'algo', 'spatial']);
const ALL = [
  ['开启子代理或多代理协作', '全程独立作答'],
  ['访问作答目录以外的路径', '必需工具的安装路径和临时目录除外'],
  ['换账户登录、按进程名结束进程', 'runas、taskkill /IM 等'],
];
const ROWS = [
  ['联网、其他 AI、安装软件', '网页搜索与抓取，调用其他模型或服务，下载或安装软件包',
    [['no'], ['no'], ['no'], ['no'], ['no'], ['no', '只禁访问 GitHub'], ['no', '只禁访问 GitHub']]],
  ['编写和运行程序', '',
    [['yes', 'Lean 编译和<br>本机已装的程序'], ['no', '只靠推理，<br>只写答案和草稿'], ['yes', '本机已装的<br>软件和库'],
     ['yes', '开发时不限，<br>提交另有规则'], ['no', '只运行题目给的<br>两个工具'], ['yes', '可开本地服务器'], ['yes', '可开本地服务器']]],
  ['浏览器 MCP', '打开作品、操作、截图',
    [['na'], ['na'], ['na'], ['na'], ['na'], ['yes', '题面写明'], ['yes', '题面写可用<br>自动化工具']]],
  ['处理器与显卡', '作答时的分配',
    [['t', '与并行批共用'], ['t', '与并行批共用'], ['t', '并行批，限 14<br>个逻辑处理器'],
     ['t', '独占整台机器'], ['t', '与并行批共用'], ['t', '与并行批共用'], ['t', '与并行批共用']]],
];
const grid = document.getElementById('grid');
const add = html => grid.insertAdjacentHTML('beforeend', html);
const mark = k => k === 'yes' ? '<svg class="yes"><use href="#yes"/></svg>' : `<i class="${k}"></i>`;

// Kinds over their columns, then the column heads.
add('<div class="bare" style="grid-row:1"></div>');
add('<div class="kind" style="grid-column:2 / 7"><h3><i class="k std"></i>标准评判题</h3><i class="br"></i></div>');
add('<div class="kind" style="grid-column:7 / 9"><h3><span class="star k des"></span>主动设计题</h3><i class="br"></i></div>');
add('<div class="bare"></div>');
COLS.forEach(c => add(`<div class="ch">
  <div class="bar">${c.cats.map(k => `<em class="${STD.has(k) ? 'edge' : ''}" style="background:var(--cat-${k})"></em>`).join('')}</div>
  <div class="ic">${c.cats.map(k => `<img class="icon" src="../../icon-${k}.svg" alt="">`).join('')}</div>
  <b>${c.name}</b><span>${c.sub}</span></div>`));

const rowHead = (name, sub, first) => `<div class="rh"${first ? ' style="border-top:none"' : ''}><b>${name}</b>${sub ? `<span>${sub}</span>` : ''}</div>`;
add('<div class="sec"><span class="eyebrow slash">All Tasks</span><h3>所有题都禁止</h3></div>');
ALL.forEach(([name, sub], i) => {
  add(rowHead(name, sub, i === 0));
  add(`<div class="all"${i === 0 ? ' style="border-top:none"' : ''}><i></i></div>`);
});
add('<div class="sec"><span class="eyebrow slash">By Task Group</span><h3>按类别不同</h3></div>');
ROWS.forEach(([name, sub, cells], i) => {
  add(rowHead(name, sub, i === 0));
  const top = i === 0 ? ' style="border-top:none"' : '';
  cells.forEach(([k, text]) => add(k === 't'
    ? `<div class="cell txt"${top}><p>${text}</p></div>`
    : `<div class="cell"${top}>${mark(k)}${text ? `<p>${text}</p>` : ''}</div>`));
});
</script>
</body>
</html>
