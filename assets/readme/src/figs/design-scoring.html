<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="size" content="960x790">
<title>设计题计分</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .desc { margin-top: 10px; }

  svg.chart { position: absolute; left: 0; top: 0; overflow: visible; }
  svg text { font-family: var(--font-ui); fill: var(--ink); }
  svg .n { font-stretch: 112%; font-variant-numeric: tabular-nums; }
  svg .colh { font-size: 13px; fill: var(--ink-2); }
  svg .who { font-size: 14px; font-weight: 700; }
  svg .dir { font-size: 17px; font-weight: 700; }
  svg .dirv { font-size: 13px; fill: var(--ink-2); font-weight: 400; }
  svg .item { font-size: 14.5px; font-weight: 700; }
  svg .itemv { font-size: 13px; fill: var(--ink-2); font-weight: 400; }
  svg .point { font-family: var(--font-text); font-size: 13px; fill: var(--ink-2); }
  svg .hint { font-family: var(--font-text); font-size: 12.5px; fill: var(--ink-2); }
  svg .sc { font-size: 14px; }
  svg .avg { font-size: 16px; font-weight: 700; }
  svg .sum { font-size: 15px; font-weight: 700; }
  svg .lb { font-family: var(--font-text); font-size: 13px; fill: var(--ink-2); }
  svg .blk { font-size: 15px; font-weight: 700; }
  svg .seg { font-size: 13px; fill: var(--ink-2); }
  svg .seg.on { fill: var(--ink); font-weight: 700; }
  svg .segv { font-size: 13px; }
  svg .total { font-size: 36px; font-weight: 800; fill: var(--violet); }
  svg .total-u { font-size: 15px; font-weight: 600; fill: var(--ink-2); }

  .foot { position: absolute; left: 40px; right: 40px; bottom: 28px; font-family: var(--font-text); font-size: 13px; line-height: 20px;
          color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 9px; }
  .foot b { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<div class="frame">
  <header class="head">
    <div class="pair"><span class="eyebrow slash">Design Task Scoring</span><h2 class="title">设计题：每个分项在分值内直接打分</h2></div>
    <i class="lead"></i>
  </header>
  <p class="desc">指南只列方向、分项、分值和一行打分点，不写评判标准。下例取物理题的一个方向，分数为示意。</p>

  <svg class="chart" id="chart" width="960" height="790"></svg>

  <p class="foot"><b>不分档、不扣分、不清零</b>：分项得分就是评分员在分值内给的分。</p>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (parent, x, y, cls, s, anchor = 'start') => {
  const t = el('text', { x, y, class: cls, 'text-anchor': anchor }, parent);
  t.innerHTML = s;
  return t;
};
const hr = (y, x1, x2, ink) => el('line', { x1, x2, y1: y + .5, y2: y + .5, stroke: ink ? 'var(--ink)' : 'var(--rule)', 'stroke-width': 1 }, svg);
const svg = document.getElementById('chart');
const defs = el('defs', {}, svg);
const f1 = v => v.toFixed(1);

/* Upper block: one direction of the physics guide, as the guide writes it, and each grader's score per item.
   Design tasks draw four-point stars in the violet family: one star per point, filled up to the score given. */
const L = 40, R = 920;
const COLS = [
  { head: 'Claude Opus 5.5', numR: 474, gauge: 486 },
  { head: 'GPT 6.1 Sol',     numR: 656, gauge: 668 },
];
const S = 14, GAP = 3, K = 0.72 / 11;
const starD = (x, y, r) => `M${x} ${y - r}Q${x + K * r} ${y - K * r} ${x + r} ${y}Q${x + K * r} ${y + K * r} ${x} ${y + r}` +
                           `Q${x - K * r} ${y + K * r} ${x - r} ${y}Q${x - K * r} ${y - K * r} ${x} ${y - r}Z`;
let clipN = 0;
const gauge = (x, cy, value, score) => {
  for (let k = 0; k < value; k++) {
    const cx = x + S / 2 + k * (S + GAP), d = starD(cx, cy, S / 2 + 1);
    el('path', { d, fill: 'var(--rule)' }, svg);
    const part = Math.max(0, Math.min(1, score - k));
    if (part > 0) {
      const id = `c${clipN++}`, cp = el('clipPath', { id }, defs);
      el('rect', { x: cx - S / 2 - 1, y: cy - S / 2 - 1, width: (S + 2) * part, height: S + 2 }, cp);
      el('path', { d, fill: 'var(--violet)', 'clip-path': `url(#${id})` }, svg);
    }
  }
};

const DIR = { name: '作用关系', value: 24 };
const ITEMS = [
  { name: '重球接触反应', value: 5, point: '重球接触后的减速、被包住、弹起、吞住或滚落，随接触状态改变', s: [4.0, 4.5] },
  { name: '密度与浮沉', value: 4, point: '同尺寸各组球的浮沉方向与浸入深度符合密度关系', s: [3.0, 3.5] },
  { name: '造浪源响应', value: 2, point: '水体扰动来自可见造浪装置的运动，装置停止后不再输入扰动', s: [1.5, 2.0] },
  { name: '水流推动响应', value: 5, point: '球被浪峰托起前推、在破碎处抛起、随水流和底流移动', s: [3.5, 4.0] },
  { name: '刚体接触响应', value: 4, point: '球与球、台面、槽壁、果冻和碎块相碰后的分离、转向与滚动', s: [3.0, 3.5] },
  { name: '参数响应', value: 4, point: '改软硬、结实程度、质量、造浪和密度后，现象相应改变', s: [2.5, 3.0] },
];

// Column heads between an ink rule and a hairline.
const H0 = 142;
hr(H0, L, R, true);
el('image', { href: '../../icon-physics.svg', x: L, y: H0 + 11, width: 16, height: 16 }, svg);
txt(svg, L + 22, H0 + 24, 'colh', '评分指南（物理题共 4 个方向、24 个分项）');
COLS.forEach(c => txt(svg, c.gauge - 46, H0 + 24, 'who', c.head));
txt(svg, R, H0 + 24, 'colh', '逐项取平均', 'end');
hr(H0 + 36, L, R);

// Direction heading, written the way the guide writes it.
{
  const y = H0 + 68;
  const t = el('text', { x: L, y, class: 'dir' }, svg);
  t.innerHTML = `${DIR.name}<tspan class="dirv n" dx="10">共 ${DIR.value} 分</tspan>`;
  txt(svg, COLS[0].gauge - 46, y - 1, 'hint', '每颗星 1 分，星数就是分值；填色的部分是给的分');
}

const ROW0 = H0 + 84, ROWH = 50;
ITEMS.forEach((it, i) => {
  const top = ROW0 + i * ROWH, mid = top + 18;
  const t = el('text', { x: L, y: top + 15, class: 'item' }, svg);
  t.innerHTML = `${it.name}<tspan class="itemv n" dx="8">${it.value} 分</tspan>`;
  txt(svg, L, top + 36, 'point', it.point);
  COLS.forEach((c, j) => {
    txt(svg, c.numR, mid + 5, 'sc n', f1(it.s[j]), 'end');
    gauge(c.gauge, mid, it.value, it.s[j]);
  });
  txt(svg, R, mid + 6, 'avg n', f1((it.s[0] + it.s[1]) / 2), 'end');
});

// Sum line: the items add up to the direction's subtotal, for each grader and for the average.
const SUMY = ROW0 + ITEMS.length * ROWH + 6;
{
  hr(SUMY, COLS[0].numR - 52, R, true);
  txt(svg, COLS[0].numR - 64, SUMY + 24, 'lb', '相加', 'end');
  COLS.forEach((c, j) => {
    const s = ITEMS.reduce((a, it) => a + it.s[j], 0);
    txt(svg, c.numR, SUMY + 24, 'sum n', f1(s), 'end');
    txt(svg, c.gauge, SUMY + 24, 'lb n', `/ ${DIR.value}`);
  });
  const avg = ITEMS.reduce((a, it) => a + (it.s[0] + it.s[1]) / 2, 0);
  txt(svg, R, SUMY + 25, 'avg n', f1(avg), 'end');
}

/* Lower block: the whole task. Four directions side by side, length by value (100 in all), each filled to its
   averaged subtotal; the direction worked through above is violet 500, the others violet 300. */
const DIRS = [
  ['现象形态与运动层次', 47, 37.5], ['材质与光影', 17, 13.5], ['作用关系', 24, 19.0], ['演示与交付', 12, 9.5],
];
{
  const yR = SUMY + 46, yH = yR + 34, yBar = yH + 46, BH = 24, SG = 4, BR = 740;
  hr(yR, L, R, true);
  txt(svg, L, yH, 'blk', '4 个方向的平均分相加，就是本题总分');
  const k = (BR - L - SG * (DIRS.length - 1)) / 100;
  const total = DIRS.reduce((a, d) => a + d[2], 0);
  let x = L;
  DIRS.forEach(([name, v, s], i) => {
    const w = v * k, on = i === 2;
    el('rect', { x, y: yBar, width: w, height: BH, fill: 'var(--chip)' }, svg);
    el('rect', { x, y: yBar, width: w * s / v, height: BH, fill: on ? 'var(--violet)' : 'var(--violet-300)' }, svg);
    const cx = x + w / 2;
    txt(svg, cx, yBar - 9, `seg${on ? ' on' : ''}`, name, 'middle');
    txt(svg, cx, yBar + BH + 18, 'segv n', `<tspan style="font-weight:700">${f1(s)}</tspan><tspan style="fill: var(--ink-2)">/${v}</tspan>`, 'middle');
    x += w + SG;
  });
  const t = el('text', { x: R, y: yBar + BH - 2, 'text-anchor': 'end' }, svg);
  t.innerHTML = `<tspan class="total n">${f1(total)}</tspan><tspan class="total-u n" dx="6">/ 100</tspan>`;
  console.log('lower block bottom', yBar + BH + 18);
}
</script>
</body>
</html>
