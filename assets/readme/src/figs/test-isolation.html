<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="size" content="960x762">
<title>作答环境的隔离</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .desc { margin-top: 10px; }

  /* Access marks: violet for what can be reached (darker = more), ink for a system wall,
     hatch for a rule, an empty dashed square for a fresh start. */
  .mk { display: inline-block; width: 14px; height: 14px; flex: none; }
  .mk.rw { background: var(--violet-600); }
  .mk.ro { background: var(--violet-300); }
  .mk.sys { background: var(--ink); }
  .mk.rule { background: var(--hatch); outline: 1px solid var(--ink); outline-offset: -1px; }
  .mk.fresh { border: 1px dashed var(--ink-2); }
  .mk.na { height: 1.5px; width: 12px; margin: 0 1px; background: var(--ink-3); }
  .legend { margin-top: 12px; }
  .legend i.mk { width: 14px; height: 14px; }
  .legend i.mk.fresh { border: 1px dashed var(--ink-2); }

  /* Who (columns) can reach what (rows). */
  .grid { display: grid; grid-template-columns: 300px 1fr 1fr; margin-top: 20px; }
  .grid > div { border-top: 1px solid var(--rule); padding: 10px 24px 10px 0; }
  .grid .ch { border-top: none; padding: 0 24px 10px 0; }
  .ch h3 { font-size: 17px; }
  .ch span { font-family: var(--font-text); font-size: 13px; line-height: 18px; color: var(--ink-2); }
  .grid .first { border-top: 1px solid var(--ink); }
  .rh b { display: block; font-size: 14.5px; font-weight: 700; line-height: 20px; }
  .rh span { display: block; font-family: var(--font-text); font-size: 12.5px; line-height: 18px; color: var(--ink-2); margin-top: 2px; }
  .cell { display: flex; align-items: flex-start; column-gap: 10px; }
  .cell .mk { margin-top: 3px; }
  .cell .mk.na { margin-top: 10px; }
  .cell p { font-family: var(--font-text); font-size: 13.5px; line-height: 20px; color: var(--ink); }
  .cell.none p { color: var(--ink-2); }

  /* The shell around every tested session: one lime-100 band marks the group. */
  .shell { margin-top: 18px; background: var(--lime-100); padding: 16px 20px 16px;
           display: grid; grid-template-columns: 128px repeat(4, 1fr); column-gap: 16px; }
  .shell .t h3 { font-size: 16px; line-height: 22px; }
  .shell > div + div { border-left: 1px solid var(--rule); padding-left: 14px; }
  .shell b { display: block; font-size: 14px; line-height: 20px; }
  .shell span { display: block; font-family: var(--font-text); font-size: 12.5px; line-height: 18px; color: var(--ink-2); margin-top: 4px; }
</style>
</head>
<body>
<div class="frame">
  <header class="head">
    <div class="pair"><span class="eyebrow slash">Who Sees What</span><h2 class="title">谁能看到什么</h2></div>
    <i class="lead"></i>
  </header>
  <p class="desc">受测会话和评分员在同一台机器上，分别用两个 Windows 账户运行。评分在全部作答结束后才开始。</p>
  <div class="legend">
    <span><i class="mk rw"></i>读写</span>
    <span><i class="mk ro"></i>只读</span>
    <span><i class="mk sys"></i>系统拒绝：Windows 权限挡住</span>
    <span><i class="mk rule"></i>规定禁止：题面或评分提示词禁止</span>
    <span><i class="mk fresh"></i>从空白开始</span>
  </div>

  <div class="grid" id="grid">
    <div class="ch"></div>
    <div class="ch"><h3>受测会话</h3><span>专用的普通账户，每个会话单独登录</span></div>
    <div class="ch"><h3>评分员</h3><span>管理员账户，每个评分任务一个新会话</span></div>
  </div>

  <div class="shell">
    <div class="t"><span class="eyebrow slash">Shell</span><h3>每个受测会话<br>的外壳</h3></div>
    <div><b>单独登录</b><span>每个会话是受测账户的一次单独登录</span></div>
    <div><b>进程保护</b><span>其他会话结束不了这些进程，按进程名也不行</span></div>
    <div><b>作业对象</b><span>到时结束模型启动的程序</span></div>
    <div><b>不开沙箱</b><span>智能体不开沙箱和审批，能做什么由账户权限决定</span></div>
  </div>
</div>
<script>
// Facts: README.md (隔离的作答环境) and the previous figure.
const ROWS = [
  ['题库仓库', '题面原件、评分指南、参考答案、测评程序',
    ['sys', '整个仓库拒绝访问'], ['ro', '读题面、评分指南、答案和评测脚本']],
  ['本题作答目录', '开场只复制本题题面和材料',
    ['rw', '读写，保存作答文件'], ['ro', '原件只读，复制到自己的目录再评；只写自己的评分表']],
  ['同一模型其他题的作答目录', '',
    ['rule', '不得访问'], ['na', '不涉及']],
  ['评测工具', '启动脚本、提示模板、提醒钩子',
    ['ro', '只读，宿主写日志的信箱目录除外'], ['na', '不涉及']],
  ['其他受测会话的进程', '同时作答的会话',
    ['sys', '看得见，结束不了'], ['na', '不涉及']],
  ['会话与记忆', '',
    ['fresh', '记忆开测前清空，作答时关闭自动记忆'], ['fresh', '每个评分任务一个新会话']],
  ['另一位评分员的目录和结果', '只有设计题主体有两位评分员',
    ['na', '不涉及'], ['rule', '不得查看，各评各的']],
];
const grid = document.getElementById('grid');
ROWS.forEach(([name, sub, a, b], i) => {
  const first = i === 0 ? ' first' : '';
  grid.insertAdjacentHTML('beforeend', `<div class="rh${first}"><b>${name}</b>${sub ? `<span>${sub}</span>` : ''}</div>`);
  [a, b].forEach(([mark, text]) => grid.insertAdjacentHTML('beforeend',
    `<div class="cell${mark === 'na' ? ' none' : ''}${first}"><i class="mk ${mark}"></i><p>${text}</p></div>`));
});
</script>
</body>
</html>
