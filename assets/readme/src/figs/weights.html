<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="size" content="960x492">
<title>权重分配</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .desc { margin-top: 10px; }
  .plot { position: absolute; left: 40px; top: 134px; width: 880px; }
  .plot > * { position: absolute; white-space: nowrap; }

  .ch { display: flex; align-items: center; column-gap: 6px; }
  .ch .field { font-size: 12px; }
  .cn { font-size: 13.5px; font-weight: 700; line-height: 20px; }
  .cw { font-size: 22px; }
  .cell { height: 44px; }
  .tw { font-size: 13px; font-weight: 700; line-height: 18px; }
  .tw .cnx { font-family: var(--font-text); font-weight: 400; color: var(--ink-2); margin-right: 4px; }
  .tn { font-family: var(--font-text); font-size: 12.5px; line-height: 17px; color: var(--ink-2); }

  /* Brackets: which share each kind of task carries, in that kind's colour; the shape marks the kind as well. */
  .kb { height: 7px; border: 1px solid var(--ink); border-top: none; }
  .kb.std { border-color: var(--lime-800); }
  .kb.des { border-color: var(--violet-600); }
  .kl { display: flex; align-items: baseline; column-gap: 10px; }
  .kl h3 { font-size: 16px; }
  .kl .fig { font-size: 28px; }
  .kl.std .fig { color: var(--lime-800); }
  .kl.des .fig { color: var(--violet); }

  .rl { height: 1px; background: var(--ink-3); }
  .tk { width: 1px; background: var(--ink-3); }
  .tl { font-size: 12px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="frame">
  <header class="head">
    <div class="pair"><span class="eyebrow slash">Weights</span><h2 class="title">权重分配</h2></div>
    <i class="lead"></i>
  </header>
  <p class="desc">10 个类别各占 10 分，类别内各题平分；条长按权重精确绘制，顺序同题目总表，类别用简称。</p>
  <div class="plot" id="plot"></div>
</div>
<script>
// Weights in percent, exact. Category weight = sum of its tasks.
// Cells take the category colour --cat-<key>; the first five (standard, lime) add the ink edge.
const CATS = [
  ['reason',   '数学推理',       '10%',  [['形式化<br>证明题', 5], ['数学竞赛<br>原创试题', 5]]],
  ['algo',     '性能优化',       '10%',  [[null, 5], [null, 5]]],
  ['battle',   '算法对抗',       '10%',    [['攻城略地', 10]]],
  ['spatial',  '空间推理',       '10%',    [['鲁班锁<br>拆解', 10]]],
  ['drawing',  '识图建模',       '10%',    [['工程图纸<br>三维还原', 10]]],
  ['interact', '交互应用',       '10%',    [['AE动效<br>编辑器', 10]]],
  ['game',     '游戏开发',       '10%',    [['动态路由塔防', 10]]],
  ['physics',  '物理模拟',       '10%',    [['果冻冲击与<br>造浪水槽', 10]]],
  ['visual',   '视觉渲染',       '10%',  [['太阳雨<br>渔港', 5], ['星际<br>战舰<br>编队', 5]]],
  ['system',   '系统架构',       '10%',  [['操作系统<br>嵌套', 10]]],
];
const STD = 5;
// The two kinds of task: contiguous in this order (standard first, as in the task table).
const KINDS = [['std', '标准评判题', ['7 题', '程序校验生成分数'], 0, 50], ['des', '主动设计题', ['6 题', '两位评分员各评取平均'], 50, 100]];
const MARK = { std: '<i class="k std"></i>', des: '<span class="star k des"></span>' };
const W = 880, P = W / 100;               // px per percentage point
const GAP = 4, TGAP = 2;                  // paper gap between categories / between tasks, centred on the exact boundary
const NO_Y = 0, CN_Y = 22, CW_Y = 46, BAR_Y = 82, BAR_H = 44, TW_Y = BAR_Y + BAR_H + 10, TN_Y = TW_Y + 20,
      KIND_Y = TN_Y + 62, RULER_Y = KIND_Y + 86;
const plot = document.getElementById('plot');
function put(cls, css, html = '') {
  const d = document.createElement('div');
  d.className = cls;
  d.style.cssText = css;
  d.innerHTML = html;
  plot.appendChild(d);
  return d;
}

let at = 0;
CATS.forEach(([k, name, w, tasks], ci) => {
  const total = tasks.reduce((s, t) => s + t[1], 0);
  const l = at * P + (ci ? GAP / 2 : 0), r = (at + total) * P - (ci < CATS.length - 1 ? GAP / 2 : 0);
  put('ch', `left:${l}px;top:${NO_Y}px`, `<span class="field">${String(ci + 1).padStart(2, '0')}</span><img class="icon" src="../../icon-${k}.svg" alt="">`);
  put('cn', `left:${l}px;top:${CN_Y}px`, name);
  put('cw fig', `left:${l}px;top:${CW_Y}px`, w);
  let t0 = at;
  tasks.forEach(([tn, tw], ti) => {
    const a = ti ? t0 * P + TGAP / 2 : l, b = ti < tasks.length - 1 ? (t0 + tw) * P - TGAP / 2 : r;
    put('cell' + (ci < STD ? ' edge' : ''), `left:${a}px;top:${BAR_Y}px;width:${b - a}px;background:var(--cat-${k})`);
    if (tn) {
      put('tw num', `left:${a}px;top:${TW_Y}px`, `${tw}%`);
      put('tn', `left:${a}px;top:${TN_Y}px`, tn);
    }
    t0 += tw;
  });
  if (k === 'algo') put('tw num', `left:${l}px;top:${TW_Y}px`, `<span class="cnx">两题各</span>5%`);
  at += total;
});

// Brackets: which share of the total each kind of task carries.
KINDS.forEach(([kind, name, facts, a, b], i) => {
  const l = a * P + (i ? GAP / 2 : 0), r = b * P - (i < KINDS.length - 1 ? GAP / 2 : 0);
  put('kb ' + kind, `left:${l}px;top:${KIND_Y}px;width:${r - l}px`);
  put('kl ' + kind, `left:${l}px;top:${KIND_Y + 18}px`,
      `<h3>${MARK[kind]}${name}</h3><span class="fig">${b - a}%</span><span class="field facts">${facts.map(t => `<span>${t}</span>`).join('')}</span>`);
});

// Scale: 0–100 %, a tick every 5 %, labels every 25 %.
put('rl', `left:0;top:${RULER_Y}px;width:${W}px`);
for (let p = 0; p <= 100; p += 5) {
  const major = p % 25 === 0, h = major ? 7 : 4;
  put('tk', `left:${Math.min(p * P, W - 1)}px;top:${RULER_Y - h}px;height:${h}px`);
  if (major) {
    const lab = put('tl num', `left:${p * P}px;top:${RULER_Y + 6}px`, p === 100 ? '100%' : p);
    lab.style.transform = p === 0 ? 'none' : p === 100 ? 'translateX(-100%)' : 'translateX(-50%)';
  }
}
</script>
</body>
</html>
