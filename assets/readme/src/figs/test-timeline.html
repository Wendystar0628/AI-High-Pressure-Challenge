<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="size" content="960x628">
<title>一场作答的时间线</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .desc { margin-top: 10px; }
  .plot { position: relative; margin-top: 20px; }
  .plot > * { position: absolute; white-space: nowrap; }

  /* Minute scale. */
  .colh { font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .tl { font-size: 12px; line-height: 16px; color: var(--ink-2); transform: translateX(-50%); }
  .tick { width: 1px; background: var(--ink-3); }
  .axis { height: 1px; background: var(--ink-3); }
  .hr { left: 0; right: 0; height: 1px; background: var(--rule); }
  .hr.ink { background: var(--ink); }

  /* Lane name: kind mark, name, then the example it shows. */
  .lane { font-size: 15px; font-weight: 700; line-height: 22px; display: flex; align-items: center; }
  .sub { font-family: var(--font-text); font-size: 13px; line-height: 18px; color: var(--ink-2); }

  /* One bar per turn: design tasks violet, standard tasks lime with the ink edge. */
  .turn { height: 14px; }
  .turn.des { background: var(--violet); }
  .turn.std { background: var(--lime); outline: 1px solid var(--ink); outline-offset: -1px; }
  .idle { height: 14px; background: var(--hatch); }
  .last { background: var(--cyan-100); border-left: 1px solid var(--cyan-800); }
  .stop { width: 2px; background: var(--ink); }
  .end { font-size: 14px; font-weight: 700; line-height: 20px; }
  .cut { width: 12px; overflow: visible; }

  /* Messages: a label, a 1px ink lead, a four-point star where it arrives on the bar. */
  .msg { font-size: 13px; line-height: 18px; }
  .msg.c { transform: translateX(-50%); }
  .soft { font-family: var(--font-text); font-size: 13px; line-height: 18px; color: var(--ink-2); transform: translateX(-50%); }
  .leadv { width: 1px; background: var(--ink); }
  .plot .star.lv { color: var(--ink); width: 9px; height: 9px; }

  /* The interrupted lane: brackets under its two segments. */
  .kb { height: 7px; border: 1px solid var(--ink); border-top: none; }
  .kl { font-family: var(--font-text); font-size: 13px; line-height: 18px; color: var(--ink); }

  .notes { display: grid; grid-template-columns: 1fr 1fr; column-gap: 36px; row-gap: 6px; margin-top: 14px; }
  .notes div { font-family: var(--font-text); font-size: 13px; line-height: 20px; color: var(--ink-2); display: flex; align-items: flex-start; column-gap: 8px; }
  .notes b { font-family: var(--font-ui); color: var(--ink); font-weight: 700; margin-right: 6px; }
  .notes i { flex: none; display: inline-block; width: 22px; height: 14px; margin-top: 3px; }
  .notes i.last { background: var(--hatch), var(--cyan-100); }
</style>
</head>
<body>
<div class="frame">
  <header class="head">
    <div class="pair"><span class="eyebrow slash">Timeline of a Run</span><h2 class="title">一场作答的时间线</h2></div>
    <i class="lead"></i>
  </header>
  <p class="desc">示意图。条是模型的一轮工作，星是消息送达的时刻。受测模型看不到限时，所有提示都不报时间。</p>
  <div class="plot" id="plot"></div>
  <div class="notes">
    <div><span><b>新的一轮</b>星在条下方：开场、接回原会话，或一轮正常结束后立即续做</span></div>
    <div><span><b>整体进度提示</b>星在条上方：只发给主动设计题，累计用时到限时一半时</span></div>
    <div><span><b>提交提醒</b>星在条上方：两类题每段作答剩余 10 分钟时各一次</span></div>
    <div><i class="last"></i><span><b>最后 10 分钟</b>一轮结束后不再续做，会话空闲（斜线纹）到时</span></div>
  </div>
</div>
<script>
// A schematic: turn lengths are an example; the rules (half time, last 10 minutes, 72 minutes left) are from README.md.
const LANES = [
  { kind: 'des', name: '主动设计题', sub: ['以 100 分钟题为例'], end: 100,
    turns: [[0, 24], [24, 47], [47, 71], [71, 94]], idle: [94, 100],
    below: [[0, '开场提示'], [24, '立即续做'], [47, '立即续做'], [71, '立即续做']],
    above: [[50, '整体进度提示'], [90, '提交提醒']], note: [97, '不再续做'] },
  { kind: 'std', name: '标准评判题', sub: ['以 60 分钟题为例', '没有整体进度提示'], end: 60,
    turns: [[0, 29], [29, 42], [42, 56]], idle: [56, 60],
    below: [[0, '开场提示'], [29, '立即续做'], [42, '立即续做']],
    above: [[50, '提交提醒']], note: [58, '不再续做'] },
  { kind: 'des', name: '中断后续做', sub: ['同一道 100 分钟题'], end: 100, cut: 28,
    turns: [[0, 28], [28, 66], [66, 93]], idle: [93, 100],
    below: [[0, '开场提示'], [28, '续做提示'], [66, '立即续做']],
    above: [[50, '整体进度提示'], [90, '本段的提交提醒']], note: [96.5, '不再续做'],
    brackets: [[0, 28, '额度用尽，中断'], [28, 100, '用剩余的 72 分钟接回原会话，故障处理的时间不计']] },
];

const X0 = 204, X1 = 806, S = (X1 - X0) / 100, x = m => X0 + m * S;
const plot = document.getElementById('plot');
function put(cls, css, html = '') {
  const d = document.createElement('div');
  d.className = cls;
  d.style.cssText = css;
  d.innerHTML = html;
  plot.appendChild(d);
  return d;
}
const star = (cx, cy) => put('star lv', `left:${cx - 4.5}px;top:${cy - 4.5}px`);

// Minute scale: a tick every 5 minutes, a label every 10.
for (let m = 0; m <= 100; m += 5) {
  const h = m % 10 === 0 ? 7 : 4;
  put('tick', `left:${x(m) - 0.5}px;top:${24 - h}px;height:${h}px`);
  if (m % 10 === 0) put('tl num', `left:${x(m)}px;top:0`, m);
}
put('colh', `left:${X1 + 22}px;top:0`, '分钟');
put('axis', `left:${X0}px;top:24px;width:${X1 - X0}px`);

let y = 30;
LANES.forEach((L, li) => {
  const t = y, barY = t + 46, BAR = 14, mid = barY + BAR / 2;
  put(li ? 'hr' : 'hr ink', `top:${t}px`);
  const mark = L.kind === 'std' ? '<i class="k std"></i>' : '<span class="star k des"></span>';
  put('lane', `left:0;top:${barY - 16}px`, mark + L.name);
  L.sub.forEach((s, i) => put('sub', `left:0;top:${barY + 8 + i * 18}px;transform:none`, s));

  // The last 10 minutes of the segment: a cyan reference band behind the bar.
  put('last', `left:${x(L.end - 10)}px;top:${barY - 14}px;width:${10 * S}px;height:${BAR + 28}px`);
  // Turns, separated by a 3 px paper gap; the idle tail is hatched.
  L.turns.forEach(([a, b]) => put('turn ' + L.kind, `left:${x(a) + (a ? 1.5 : 0)}px;top:${barY}px;width:${(b - a) * S - (a ? 3 : 1.5)}px`));
  put('idle', `left:${x(L.idle[0]) + 1.5}px;top:${barY}px;width:${(L.idle[1] - L.idle[0]) * S - 1.5}px`);
  // Deadline.
  put('stop', `left:${x(L.end) - 1}px;top:${barY - 8}px;height:${BAR + 16}px`);
  put('end', `left:${x(L.end) + 10}px;top:${mid - 10}px`, '到时中止');

  // Messages that start a turn: below the bar. Reminders inserted into a running turn: above it.
  L.below.forEach(([m, text]) => {
    const cx = x(m), lab = t + 80;
    put('leadv', `left:${cx - 0.5}px;top:${barY + BAR + 4}px;height:${lab - 3 - (barY + BAR + 4)}px`);
    star(cx, barY + BAR);
    put('msg' + (m ? ' c' : ''), `left:${m ? cx : cx - 2}px;top:${lab}px`, text);
  });
  L.above.forEach(([m, text]) => {
    const cx = x(m), lab = t + 8;
    put('leadv', `left:${cx - 0.5}px;top:${lab + 21}px;height:${barY - 4 - (lab + 21)}px`);
    star(cx, barY);
    put('msg c', `left:${cx}px;top:${lab}px`, text);
  });
  put('soft', `left:${x(L.note[0])}px;top:${t + 80}px`, L.note[1]);

  // The interruption: a break mark across the bar where the session stopped.
  if (L.cut !== undefined) {
    const NS = 'http://www.w3.org/2000/svg', s = document.createElementNS(NS, 'svg');
    s.setAttribute('class', 'cut');
    s.setAttribute('viewBox', '0 0 12 26');
    s.setAttribute('height', 26);
    s.style.cssText = `position:absolute;left:${x(L.cut) - 6}px;top:${barY - 6}px`;
    s.innerHTML = '<path d="M1 26 L7 0 M5 26 L11 0" stroke="var(--ink)" stroke-width="1.5"/>';
    plot.appendChild(s);
  }
  y += 112;
  if (L.brackets) {
    L.brackets.forEach(([a, b, text]) => {
      put('kb', `left:${x(a) + (a ? 2 : 0)}px;top:${t + 106}px;width:${(b - a) * S - (a ? 2 : 2)}px`);
      put('kl', `left:${x(a) + (a ? 2 : 0)}px;top:${t + 118}px`, text);
    });
    y += 38;
  }
});
put('hr ink', `top:${y}px`);
plot.style.height = `${y + 1}px`;
</script>
</body>
</html>
